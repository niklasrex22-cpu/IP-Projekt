<meta charset="utf-8">
<title>Börsenfieber</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Börsensaal – links der Spieltisch (Nachricht, Handel, Würfel), rechts die Fallblatt-Kurstafel wie am Bahnhof; darüber ein Laufband mit den Kursen. */
:root{
  --paper:#ECEFF3; --surface:#FFFFFF; --surface-2:#E2E7EE; --ink:#121722; --muted:#586274; --line:#D2D9E2;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#DCE4FB;
  --gain:#11804C; --loss:#C93428; --warn:#9A5B00; --warn-soft:#FBEFD9;
  --board:#161A21; --board-2:#212732; --flap:#2B313C; --flap-hi:#353C49; --flap-ink:#F4F1E6; --board-muted:#8C95A5; --amber:#F2B233;
  --board-gain:#4ADE95; --board-loss:#FF7A6B;
  --shadow:0 1px 2px rgba(18,23,34,.06),0 8px 24px rgba(18,23,34,.07);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1117; --surface:#171B23; --surface-2:#222835; --ink:#E8ECF2; --muted:#98A2B3; --line:#2A3140;
    --accent:#7D9BFF; --accent-ink:#0A1022; --accent-soft:#1D2747;
    --gain:#3DD68C; --loss:#FF6B5E; --warn:#F2B233; --warn-soft:#3A2C0E;
    --board:#090C11; --board-2:#131821; --flap:#1D232D; --flap-hi:#262D39;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1117; --surface:#171B23; --surface-2:#222835; --ink:#E8ECF2; --muted:#98A2B3; --line:#2A3140;
  --accent:#7D9BFF; --accent-ink:#0A1022; --accent-soft:#1D2747;
  --gain:#3DD68C; --loss:#FF6B5E; --warn:#F2B233; --warn-soft:#3A2C0E;
  --board:#090C11; --board-2:#131821; --flap:#1D232D; --flap-hi:#262D39;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h2{font-size:24px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.gain{color:var(--gain)} .loss{color:var(--loss)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* ---------- Knöpfe ---------- */
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;
  transition:transform .15s ease,border-color .15s,background .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(1px) scale(.98)}
button:disabled{opacity:.38;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;padding:12px 22px;font-size:16px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000);}
.btn-main:hover:not(:disabled){box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn-main:active:not(:disabled){box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000);transform:translateY(3px)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:8px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

/* ---------- Kopf & Laufband ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1260px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:22px;font-weight:800}
.brand svg{width:34px;height:24px}
.brand .fever{fill:none;stroke:var(--loss);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:0}
.enter-brand .fever{animation:draw 1.2s ease-out both}
@keyframes draw{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
.progress{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.years{display:flex;gap:4px;align-items:center}
.years i{width:9px;height:9px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);transition:background .3s}
.years i.done{background:var(--accent);border-color:var(--accent)}
.years i.now{background:var(--amber);border-color:var(--amber);transform:scale(1.25)}
.steps{display:flex;gap:4px;font-size:13px}
.steps span{padding:3px 10px;border-radius:99px;color:var(--muted)}
.steps span.on{background:var(--ink);color:var(--surface);font-weight:600}
.ticker{background:var(--board);color:var(--flap-ink);overflow:hidden;white-space:nowrap;font-family:var(--font-mono);font-size:13px;border-bottom:1px solid #000}
.ticker-track{display:inline-flex;gap:0;padding-block:7px;animation:tick 38s linear infinite}
.ticker-track span{padding:0 22px;border-right:1px solid #ffffff1a}
.ticker b{color:var(--amber);font-weight:600}
.ticker .up{color:var(--board-gain)} .ticker .dn{color:var(--board-loss)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- Seite ---------- */
.wrap{max-width:1260px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:24px;align-items:start}
.grid>main{min-width:0;display:flex;flex-direction:column;gap:18px}
@media (max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
.tag{font-family:var(--font-mono);font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.flash{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.enter .flash{animation:shake .45s ease}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* ---------- Fallblatt-Kurstafel ---------- */
.board{background:var(--board);color:var(--flap-ink);border-radius:18px;padding:20px 18px;box-shadow:0 18px 40px rgba(10,14,20,.28);position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:960px){.board{position:static}}
.board-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.board-head h2{color:var(--flap-ink);font-size:20px}
.live{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--amber);display:flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.brow{padding:12px 0;border-top:1px solid #ffffff14;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.bname{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--flap-ink);min-width:0}
.bname .dot{width:8px;height:8px}
.flaps{display:flex;gap:2px;justify-self:end}
.fl{display:inline-flex;align-items:center;justify-content:center;width:19px;height:28px;border-radius:3px;font-family:var(--font-mono);font-weight:600;font-size:17px;
  background:linear-gradient(var(--flap-hi) 0 49%,var(--flap) 51% 100%);color:var(--flap-ink);position:relative;box-shadow:inset 0 -1px 0 #0006}
.fl::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#00000080}
.fl.pctsign{width:auto;padding:0 3px;font-size:12px;background:none;box-shadow:none;color:var(--board-muted)}
.fl.pctsign::after{display:none}
.fl.flip{animation:flip .5s cubic-bezier(.3,.6,.4,1) both}
@keyframes flip{0%{transform:rotateX(0)}45%{transform:rotateX(90deg);filter:brightness(1.6)}55%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
.bmeta{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:11px;color:var(--board-muted)}
.bchg{font-family:var(--font-mono);font-size:12px;justify-self:end;padding:1px 7px;border-radius:5px}
.bchg.up{color:var(--board-gain);background:#4ade9518} .bchg.dn{color:var(--board-loss);background:#ff7a6b18}
.spark{grid-column:1/-1;display:block;width:100%;height:34px}
.board-foot{margin-top:10px;font-size:12px;color:var(--board-muted)}

/* ---------- Zeitung (Nachrichtenkarte) ---------- */
.paper{perspective:1400px}
.paper-in{position:relative;transform-style:preserve-3d}
.enter .paper-in{animation:cardflip .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes cardflip{0%{transform:rotateY(180deg) translateY(-12px)}100%{transform:rotateY(0)}}
.paper-front,.paper-back{backface-visibility:hidden;border-radius:12px}
.paper-front{background:var(--surface);border:1px solid var(--line);padding:20px 22px 22px;position:relative;}
.paper-back{position:absolute;inset:0;transform:rotateY(180deg);background:var(--accent);display:grid;place-items:center;
  background-image:repeating-linear-gradient(45deg,#ffffff14 0 10px,transparent 10px 20px)}
.paper-back span{font-family:var(--font-display);font-weight:800;font-size:64px;color:var(--accent-ink)}
.masthead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--ink);padding-bottom:6px;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.masthead strong{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.headline{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,3.2vw,34px);line-height:1.08;margin:4px 0 10px;text-wrap:balance}
.lede{max-width:62ch;font-size:15.5px}
.reveal-note{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.reveal-note i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface-2);font-family:var(--font-mono);font-weight:600;color:var(--ink)}
.fx-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.fx{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:13px;background:var(--surface-2);font-weight:500}
.enter .fx{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.enter .fx:nth-child(2){animation-delay:.08s}.enter .fx:nth-child(3){animation-delay:.16s}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- Handel ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 14px;min-width:0}
.stat .v{font-family:var(--font-mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal{border:2px dashed var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--ink);width:100%;text-align:left}
.goal.open{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.goal .seal{font-family:var(--font-display);font-weight:800;font-size:20px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--surface);flex:none}
.amounts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.assets{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.arow{display:grid;grid-template-columns:minmax(140px,1.3fr) minmax(90px,.7fr) minmax(110px,.9fr) auto;gap:10px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.arow .nm{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.arow .sub{font-size:12px;color:var(--muted);font-weight:400}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.btn-buy{border-color:color-mix(in srgb,var(--gain) 45%,var(--line));color:var(--gain);font-weight:600}
.btn-sell{color:var(--loss)}
@media (max-width:620px){.arow{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr)}.arow .acts{grid-column:1/-1;justify-content:flex-start}}
.log{font-family:var(--font-mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:150px;overflow:auto}
.log div{animation:slidein .3s ease both}
@keyframes slidein{from{transform:translateX(-8px);opacity:0}to{transform:none;opacity:1}}
.credit{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--surface-2)}

/* ---------- Würfel ---------- */
.dice{display:flex;gap:6px;justify-content:flex-end}
.die{width:54px;height:46px;border-radius:11px;display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:14px;
  background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.die.tumble{animation:tumble .35s linear infinite}
.die.land{animation:land .5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(14deg) translateY(-6px)}50%{transform:rotate(-8deg) translateY(0)}75%{transform:rotate(10deg) translateY(-4px)}100%{transform:rotate(0)}}
@keyframes land{0%{transform:scale(1.35) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
.mtable td{padding:12px 8px}
.total{font-family:var(--font-mono);font-weight:600;font-size:16px}
.enter .total{animation:pop .5s .1s cubic-bezier(.3,1.6,.5,1) both}
.panic{color:var(--loss);font-weight:600;font-family:var(--font-mono)}
.roll-zone{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px}

/* ---------- Jahresabschluss & Ende ---------- */
.delta-bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;width:100%;min-width:60px}
.delta-bar i{display:block;height:100%;border-radius:99px;transform-origin:left}
.enter .delta-bar i{animation:grow .9s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:12px 0 8px;min-height:230px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(150px,30%)}
.pod .who{font-family:var(--font-display);font-weight:700;font-size:16px;text-align:center;overflow-wrap:anywhere}
.pod .pts{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.pod .block{width:100%;border-radius:12px 12px 4px 4px;display:grid;place-items:start center;padding-top:10px;font-family:var(--font-display);font-weight:800;font-size:34px;color:#fff;transform-origin:bottom}
.enter .pod .block{animation:rise .9s cubic-bezier(.2,.9,.3,1.15) both}
.enter .pod:nth-child(1) .block{animation-delay:.25s}.enter .pod:nth-child(3) .block{animation-delay:.45s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}

/* ---------- Start ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center;margin-bottom:24px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-txt h2{font-size:clamp(44px,7vw,78px);font-weight:800;line-height:.95;letter-spacing:-.035em}
.hero-txt h2 em{font-style:normal;color:var(--loss)}
.hero .pitch{font-size:18px;max-width:46ch;margin-top:16px;color:var(--muted)}
.enter .hero-txt>*{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.enter .hero-txt>*:nth-child(2){animation-delay:.1s}.enter .hero-txt>*:nth-child(3){animation-delay:.2s}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.players{display:flex;flex-direction:column;gap:8px}
.player{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.player input{flex:1;min-width:120px}
.rules{padding-left:20px;display:flex;flex-direction:column;gap:6px;margin:12px 0}
details summary{cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:17px}
.handover{text-align:center;padding:48px 22px}
.avatar{width:84px;height:84px;border-radius:24px;margin:0 auto 16px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:38px;color:#fff}
.enter .avatar{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
svg text{fill:var(--muted);font-family:var(--font-mono);font-size:11px}
.enter main>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.enter main>*:nth-child(2){animation-delay:.08s}.enter main>*:nth-child(3){animation-delay:.16s}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .ticker-track{animation:none}
}
</style>
<div id="app"></div>
<canvas id="confetti" hidden></canvas>
<script>
"use strict";
/* ============ Konstanten & Daten ============ */
const FEE = 50, START = 10000, ROUNDS = 8, CREDIT_MAX = 5000, RATE = 0.10, ROLLS = 3, INFL = 0.02;

const ASSETS = [
  {id:'spar',   name:'Sparkonto',        color:'#7A8699', fixed:1, desc:'Sicher, aber kaum Rendite – Inflation frisst den Gewinn.'},
  {id:'etf',    name:'ETF / Indexfonds', color:'#14A3A0', die:[-3,-2,2,3,3,4], desc:'Breit gestreut, schwankt mässig, langfristig solide.'},
  {id:'aktie',  name:'Aktie',            color:'#7B5CF0', die:[-8,-3,0,3,7,12], desc:'Eine einzelne Firma: höhere Chance, höheres Risiko.'},
  {id:'krypto', name:'Krypto',           color:'#F08A24', die:[-20,-10,-3,7,20,50], desc:'Extreme Schwankung, Totalverlust möglich.'},
];
const A = Object.fromEntries(ASSETS.map(a=>[a.id,a]));
const NEWS = [

  {id:'vorsorge',    name:'Vorsorge',      text:'Dein Vermögen fällt nie unter CHF 8\'000.', bonus:3000},
  {id:'divers',      name:'Diversifiziert', text:'Am Ende in alle 4 Anlagen investiert (je mind. CHF 500).', bonus:2000},
  {id:'schuldenfrei',name:'Schuldenfrei',  text:'Du nimmst während des ganzen Spiels nie einen Kredit auf.', bonus:2000},
  {id:'langfristig', name:'Langfristig',   text:'Am Ende hältst du eine Anlage seit mindestens 6 Jahren, ohne sie zu verkaufen.', bonus:2000},
  {id:'sparfuchs',   name:'Sparfuchs',     text:'Du zahlst insgesamt höchstens CHF 600 Gebühren (12 Transaktionen).', bonus:1500},

const BOT_TYPES = {
  vorsichtig:   {label:'Computer (vorsichtig)',    w:{spar:.5, etf:.4, aktie:.1}, herd:.8},
  ausgewogen:   {label:'Computer (ausgewogen)',    w:{spar:.2, etf:.5, aktie:.2, krypto:.1}, herd:.5},
  risikofreudig:{label:'Computer (risikofreudig)', w:{etf:.3, aktie:.4, krypto:.3}, herd:.3},
};
const PCOLORS = ['#1F4FD8','#D9468F','#14A37F','#E0782A','#8B5CF6','#C9A21A'];

/* ============ Hilfsfunktionen ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { const r = Math.round(n); return (r<0?'−':'') + String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g, "'"); };
const chf = n => 'CHF ' + fmt(n);
const pct = (n, sign=true) => (n>0 && sign ? '+' : n<0 ? '−' : '') + Math.abs(Math.round(n*10)/10) + ' %';
const cls = n => n>0 ? 'gain' : n<0 ? 'loss' : '';
const rnd = n => Math.floor(Math.random()*n);
const shuffle = arr => { const a = arr.slice(); for (let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ============ Spielzustand ============ */
let G = null;
let setupRows = [
  {name:'Spieler 1', type:'human'},
  {name:'Lea', type:'ausgewogen'},
  {name:'Max', type:'risikofreudig'},
];

const posVal = (p,id) => (p.shares[id]||0) * G.prices[id];
const invested = p => ASSETS.reduce((s,a)=>s+posVal(p,a.id),0);
const netWorth = p => p.cash + invested(p) - p.debt;
const updateMin = p => { p.minNet = Math.min(p.minNet, netWorth(p)); };
const humans = () => G.players.filter(p=>p.type==='human');

function newGame(){
  const goals = shuffle(GOALS);
  G = {
    year:0, phase:'news', amt:1000, flash:'', showGoal:false, rolling:false, results:null,
    prices:Object.fromEntries(ASSETS.map(a=>[a.id,100])),
    hist:Object.fromEntries(ASSETS.map(a=>[a.id,[100]])),
    lastChange:{},
    newsDeck:shuffle(NEWS),
    players:setupRows.map((r,i)=>({
      name:r.name.trim()||`Spieler ${i+1}`, type:r.type, color:PCOLORS[i],
      cash:START, shares:{}, hold:{}, debt:0, goal:goals[i], minNet:START,
      everCredit:false, fees:0, sold:new Set(), hist:[START], turnLog:[],
    })),
  };
  startYear();
}

function startYear(){
  G.year++;
  G.news = G.newsDeck.pop();
  G.results = null;
  G.phase = 'news';
  render();
}

/* ============ Transaktionen ============ */
function buy(p, id, amt){
  if (G.prices[id] <= 0) return 'Diese Anlage ist wertlos und kann nicht gekauft werden.';
  if (amt <= 0) return 'Betrag muss grösser als 0 sein.';
  if (p.cash < amt + FEE) return `Zu wenig Bargeld: Du brauchst ${chf(amt+FEE)} (inkl. ${chf(FEE)} Gebühr).`;
  p.cash -= amt + FEE; p.fees += FEE;
  if (!(p.shares[id] > 0)) p.hold[id] = 0;
  p.shares[id] = (p.shares[id]||0) + amt / G.prices[id];
  p.turnLog.push(`Kauf ${A[id].name}: ${chf(amt)} (+ ${chf(FEE)} Gebühr)`);
  return '';
}
function sell(p, id, amt, forced=false){
  const val = posVal(p,id);
  if (val <= 0) return 'Du besitzt diese Anlage nicht.';
  amt = Math.min(amt, val);
  if (amt >= val - 0.5){ p.shares[id] = 0; amt = val; }
  else p.shares[id] -= amt / G.prices[id];
  p.cash += amt - FEE; p.fees += FEE;
  p.hold[id] = 0;
  p.sold.add(id);
  p.turnLog.push(`${forced?'Zwangsverkauf':'Verkauf'} ${A[id].name}: ${chf(amt)} (− ${chf(FEE)} Gebühr)`);
  return '';
}
function borrow(p, amt){
  amt = Math.min(amt, CREDIT_MAX - p.debt);
  if (amt <= 0) return `Kreditlimite von ${chf(CREDIT_MAX)} erreicht.`;
  p.debt += amt; p.cash += amt; p.everCredit = true;
  p.turnLog.push(`Kredit aufgenommen: ${chf(amt)}`);
  return '';
}
function repay(p, amt){
  amt = Math.min(amt, p.debt, Math.max(0,p.cash));
  if (amt <= 0) return p.debt<=0 ? 'Du hast keinen Kredit.' : 'Zu wenig Bargeld zum Zurückzahlen.';
  p.debt -= amt; p.cash -= amt;
  p.turnLog.push(`Kredit zurückbezahlt: ${chf(amt)}`);
  return '';
}
// Wer kein Bargeld hat, muss Anlagen verkaufen – egal zu welchem Kurs.
const LIQ_ORDER = ['spar','etf','aktie','krypto'];
function ensureCash(p){
  const notes = [];
  for (const id of LIQ_ORDER){
    if (p.cash >= 0) break;
    const val = posVal(p,id);
    if (val <= 0) continue;
    const need = -p.cash + FEE;
    sell(p, id, Math.min(val, need), true);
    notes.push(`Zwangsverkauf ${A[id].name}`);
  }
  if (p.cash < 0 && p.debt < CREDIT_MAX){
    const a = Math.min(-p.cash, CREDIT_MAX - p.debt);
    borrow(p, a); notes.push(`Notkredit ${chf(a)}`);
  }
  if (p.cash < 0){ p.everCredit = true; notes.push(`Überzug ${chf(-p.cash)} (Schulden!)`); }
  return notes;
}

/* ============ Phasen ============ */
const act = {};
act.startTrading = () => { for (const p of G.players) p.turnLog = []; G.turn = -1; nextTurn(); };
function nextTurn(){
  G.turn++;
  while (G.turn < G.players.length && G.players[G.turn].type !== 'human'){
    botTrade(G.players[G.turn]); G.turn++;
  }
  G.flash = ''; G.showGoal = false;
  if (G.turn >= G.players.length){
    G.phase = 'market'; G.rolling = false;
  }
  else G.phase = humans().length > 1 ? 'handover' : 'trade';
  render(); window.scrollTo(0,0);
}
act.beginTurn = () => { G.phase = 'trade'; render(); };
act.endTurn = () => { updateMin(G.players[G.turn]); nextTurn(); };
const cur = () => G.players[G.turn];
const doAct = msg => { G.flash = msg || ''; updateMin(cur()); render(); };
act.setAmt = v => { G.amt = Math.max(0, Math.round(+v||0)); render(); };
act.buy = id => doAct(buy(cur(), id, G.amt));
act.sell = id => doAct(sell(cur(), id, G.amt));
act.sellAll = id => doAct(sell(cur(), id, Infinity));
act.borrow = () => doAct(borrow(cur(), G.amt));
act.repay = () => doAct(repay(cur(), G.amt));
act.toggleGoal = () => { G.showGoal = !G.showGoal; render(); };

function botTrade(p){
  p.turnLog = [];
  const T = BOT_TYPES[p.type];
  // Herdentrieb: nach einem Absturz verkaufen
  for (const a of ASSETS){
    if (a.id==='spar' || posVal(p,a.id) <= 0) continue;
    if ((G.lastChange[a.id] ?? 0) <= -15 && Math.random() < T.herd) sell(p, a.id, Infinity);
  }
  if (p.type==='risikofreudig' && G.year===1) borrow(p, 3000);
  if (p.type==='vorsichtig' && p.debt>0 && p.cash > p.debt+1000) repay(p, p.debt);
  const base = netWorth(p) + p.debt - 1000;
  for (const [id,w] of Object.entries(T.w)){
    if (G.prices[id] <= 0) continue;
    const diff = base*w - posVal(p,id);
    if (diff >= 1000 && (G.year===1 || Math.random()<.5)){
      const amt = Math.min(Math.floor(diff/500)*500, Math.floor((p.cash-FEE-300)/500)*500);
      if (amt >= 500) buy(p, id, amt);
    } else if (diff <= -2500 && Math.random()<.4){
      sell(p, id, Math.floor(-diff/500)*500);
    }
  }
  updateMin(p);
}

function sellersOf(id){ return G.players.filter(p=>p.sold.has(id)).length; }
function panicFor(id){
  const n = G.players.length;
  return id!=='spar' && n>=2 && sellersOf(id) > n/2;
}

act.roll = () => {
  if (G.rolling) return;
  G.rolling = true; render();
  const iv = setInterval(()=>{
    for (const a of ASSETS){ if (!a.die) continue; for (let k=0;k<ROLLS;k++){ const el = document.getElementById(`die-${a.id}-${k}`); if (el) el.textContent = pct(a.die[rnd(6)]); } }
  }, 70);
  setTimeout(()=>{ clearInterval(iv); computeMarket(); G.rolling=false; render(); }, 1100);
};

function computeMarket(){
  for (const p of G.players) p.netBefore = netWorth(p);
  G.results = ASSETS.map(a=>{
    const old = G.prices[a.id];
    let news = 0, dice = null, panic = 0, change;
    if (a.fixed){ change = a.fixed; }
    else {
      news = G.news.fx[a.id] || 0;
      dice = Array.from({length:ROLLS}, ()=>a.die[rnd(6)]);   // jede Runde 3× würfeln
      panic = panicFor(a.id) ? -10 : 0;
      change = news + dice.reduce((x,y)=>x+y,0) + panic;
    }
    let nw = old <= 0 ? 0 : old * (1 + change/100);
    nw = Math.max(0, nw);   // keine Obergrenze
    if (nw < 1) nw = 0;
    G.prices[a.id] = nw;
    G.hist[a.id].push(nw);
    G.lastChange[a.id] = old > 0 ? (nw/old - 1)*100 : 0;
    return {id:a.id, old, news, dice, panic, change, nw, sellers:sellersOf(a.id)};
  });
  for (const p of G.players){
    p.yearNotes = [];
    // Kreditzinsen (10 %) – auch auf Überzug
    const interest = Math.round(p.debt*RATE + Math.max(0,-p.cash)*RATE);
    if (interest > 0){ p.cash -= interest; p.yearNotes.push(`Zinsen ${chf(interest)}`); if (p.cash<0) p.yearNotes.push(...ensureCash(p)); }
    // Halten lohnt sich: nach je 3 Jahren ohne Verkauf 5 % Bonus
    for (const a of ASSETS){
      if (a.id==='spar') continue;
      if (posVal(p,a.id) > 0){
        p.hold[a.id] = (p.hold[a.id]||0) + 1;
        if (p.hold[a.id] % 3 === 0){
          const b = posVal(p,a.id)*0.05; p.cash += b;
          p.yearNotes.push(`Halte-Bonus ${A[a.id].name} ${chf(b)}`);
        }
      } else p.hold[a.id] = 0;
    }
    p.sold.clear();
    updateMin(p);
    p.hist.push(netWorth(p));
  }
}

act.next = () => { if (G.year >= ROUNDS) endGame(); else startYear(); window.scrollTo(0,0); };

function checkGoal(p){
  switch (p.goal.id){
    case 'vorsorge': return p.minNet >= 8000;
    case 'divers': return ASSETS.filter(a=>posVal(p,a.id) >= 500).length >= 4;
    case 'schuldenfrei': return !p.everCredit;
    case 'langfristig': return Object.entries(p.hold).some(([id,h])=>h>=6 && posVal(p,id)>0);
    case 'sparfuchs': return p.fees <= 600;
    case 'wachstum': return netWorth(p) >= 15000;
  }
  return false;
}
function endGame(){
  for (const p of G.players){
    p.goalMet = checkGoal(p);
    p.finalInvested = invested(p);
    p.cash += p.finalInvested; p.shares = {};
    p.cash -= p.debt; p.repaid = p.debt; p.debt = 0;
    p.final = p.cash;
    p.out = p.final < 0;
    p.score = p.out ? null : p.final + (p.goalMet ? p.goal.bonus : 0);
  }
  G.phase = 'end'; render();
}

          <li><b>Markt:</b> Jeder Würfel wird <b>dreimal</b> geworfen; die drei Würfe und die Nachricht werden addiert.</li>
          <li><b>Panik-Regel:</b> Verkauft mehr als die Hälfte der Personen dieselbe Anlage, fällt ihr Kurs zusätzlich um 10 %.</li>
          <li><b>Halten lohnt sich:</b> Wer eine Anlage 3 Jahre nicht verkauft, erhält 5 % Bonus (Sparkonto ausgenommen).</li>
          <li><b>Kredit:</b> Bis CHF 5'000 leihen, 10 % Zins pro Jahr. Fehlt Bargeld für die Zinsen, werden Anlagen automatisch verkauft.</li>
          <li>Kurse starten bei 100 % und haben keine Obergrenze. Fällt ein Kurs auf 0, ist die Anlage wertlos.</li>
          <li><b>Ende:</b> Alles wird verkauft, Kredite zurückbezahlt. Punkte = Endvermögen + Bonus fürs geheime Anlageziel. Wer Schulden hat, scheidet aus.</li>
        </ul>
        <div class="tablewrap"><table>
          <tr><th>Anlage</th><th>Würfelseiten</th><th>Was man lernt</th></tr>
          ${ASSETS.map(a=>`<tr><td><span class="row"><span class="dot" style="background:${a.color}"></span>${a.name}</span></td><td class="num">${a.die?a.die.map(d=>pct(d)).join(', '):'immer +1 %'}</td><td class="muted">${a.desc}</td></tr>`).join('')}
        </table></div>
        <h3 style="margin-top:16px">Geheime Anlageziele</h3>
        <ul class="rules">${GOALS.map(g=>`<li><b>${g.name}:</b> ${g.text} → +${fmt(g.bonus)} Punkte</li>`).join('')}</ul>
      </details>
    </section>
  </main></div>`;
}

/* ============ Fallblatt & Grafiken ============ */
const shownFlaps = {};
function flaps(key, str){
  const prev = shownFlaps[key];
  shownFlaps[key] = str;
  return [...str].map((c,i)=>{
    const flip = (prev===undefined || prev[i]!==c) && !REDUCE();
    return `<span class="fl${flip?' flip':''}" style="animation-delay:${i*70}ms">${c===' '?'&nbsp;':c}</span>`;
  }).join('') + '<span class="fl pctsign">%</span>';
}
function sparkline(vals, color, id){
  const w=300, h=34, max=Math.max(...vals), min=Math.min(...vals);
  const span = (max-min) || 1, n = Math.max(ROUNDS, vals.length-1);
  const X = i => (i/n*(w-6)+3).toFixed(1), Y = v => (h-4-(v-min)/span*(h-10)).toFixed(1);
  const pts = vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  const last = vals.length-1;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="g-${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${vals.length>1?`<polygon points="${X(0)},${h} ${pts} ${X(last)},${h}" fill="url(#g-${id})"/>`:''}
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${X(last)}" cy="${Y(vals[last])}" r="3" fill="${color}"/>
  </svg>`;
}
function viewBoard(demo){
  const prices = demo ? Object.fromEntries(ASSETS.map(a=>[a.id,100])) : G.prices;
  return `<aside class="board" aria-label="Kurstafel">
    <div class="board-head"><h2>Kurstafel</h2><span class="live"><i></i>${demo?'BEREIT':`JAHR ${G.year}`}</span></div>
    ${ASSETS.map(a=>{
      const p = prices[a.id], ch = demo ? undefined : G.lastChange[a.id];
      const hist = demo ? [100,100] : G.hist[a.id];
      return `<div class="brow" title="${esc(a.desc)}">
        <span class="bname"><span class="dot" style="background:${a.color}"></span>${a.name}</span>
        <span class="flaps" aria-label="${p.toFixed(1)} Prozent">${flaps((demo?'d-':'')+a.id, p.toFixed(1).padStart(5,' '))}</span>
        <span class="bmeta">${a.die?'🎲 3× '+a.die.map(d=>(d>0?'+':'')+d).join(' '):'fix +1 % pro Jahr'}</span>
        ${ch!==undefined?`<span class="bchg ${ch>=0?'up':'dn'}">${ch>=0?'▲':'▼'} ${pct(ch)}</span>`:'<span></span>'}
        ${demo||hist.length<2?'':sparkline(hist, a.color, a.id)}
      </div>`;}).join('')}
    <p class="board-foot">Start = 100 % · Kurse in Prozent des Startwerts</p>

function tickerHTML(){
  const items = ASSETS.map(a=>{
    const p = G ? G.prices[a.id] : 100, ch = G ? G.lastChange[a.id] : undefined;
    return `<span><b>${a.name.toUpperCase()}</b> ${p.toFixed(1)} % ${ch===undefined?'':`<span class="${ch>=0?'up':'dn'}">${ch>=0?'▲':'▼'} ${pct(ch)}</span>`}</span>`;

function lineChart(series){

/* ============ Animationen ============ */
function countUp(){
  if (REDUCE()) return;
  document.querySelectorAll('[data-count-to]').forEach(el=>{
    const from = +el.dataset.countFrom, to = +el.dataset.countTo, t0 = performance.now(), dur = 1100;
    const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = chf(from+(to-from)*e); if (k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function confetti(){
  const cv = document.getElementById('confetti');
  if (!cv || REDUCE()) return;
  cv.hidden = false;
  const ctx = cv.getContext('2d'), dpr = window.devicePixelRatio||1;
  const W = cv.width = innerWidth*dpr, H = cv.height = innerHeight*dpr;
  const cols = [...PCOLORS, '#F2B233', '#4ADE95'];
  const bits = Array.from({length:160},()=>({x:Math.random()*W, y:-Math.random()*H*.6, vx:(Math.random()-.5)*3*dpr, vy:(2+Math.random()*4)*dpr,
    r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, s:(5+Math.random()*7)*dpr, c:cols[rnd(cols.length)]}));
  const t0 = performance.now();
  const frame = t => {
    ctx.clearRect(0,0,W,H);
    for (const b of bits){ b.x+=b.vx; b.y+=b.vy; b.vy+=.04*dpr; b.r+=b.vr;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle=b.c; ctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); ctx.restore(); }
    if (t-t0 < 4200) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); cv.hidden = true; }
  };
  requestAnimationFrame(frame);
}

/* ============ Würfeln mit Animation ============ */
act.roll = () => {
  if (G.rolling || G.results) return;
  G.rolling = true; render();
  computeMarket();                  // Ergebnis steht fest, wird aber erst nach der Animation gezeigt
  const finish = () => { G.rolling = false; render(); window.scrollTo({top:0, behavior: REDUCE()?'auto':'smooth'}); };
  if (REDUCE()){ finish(); return; }
  const live = [...document.querySelectorAll('.die[data-a]')];
  const iv = setInterval(()=>{ for (const el of live) if (el.classList.contains('tumble')) el.textContent = pct(A[el.dataset.a].die[rnd(6)]); }, 75);
  for (let k=0;k<ROLLS;k++){
    setTimeout(()=>{
      for (const el of live.filter(e=>+e.dataset.k===k)){
        const r = G.results.find(x=>x.id===el.dataset.a);
        el.textContent = pct(r.dice[k]); el.classList.remove('tumble'); el.classList.add('land');
      }
    }, 650 + k*420);
  }
  setTimeout(()=>{ clearInterval(iv); finish(); }, 650 + ROLLS*420 + 450);
};

/* ============ Render ============ */
const STEP_NAMES = ['Nachricht','Handeln','Markt'];
let lastKey = null;
function render(){
  const app = document.getElementById('app');
  const key = G ? [G.phase, G.year, G.turn, G.rolling?'r':'', G.results&&!G.rolling?'res':''].join('|') : 'setup';
  const fresh = key !== lastKey;
  lastKey = key;
  const yearDots = G ? Array.from({length:ROUNDS},(_,i)=>`<i class="${i+1<G.year||G.phase==='end'?'done':i+1===G.year?'now':''}"></i>`).join('') : '';
  const idx = G ? {news:0, handover:1, trade:1, market:2}[G.phase] : -1;
  const header = `<header class="top"><div class="top-in">
      <div class="brand ${fresh&&!G?'enter-brand':''}">
        <svg viewBox="0 0 34 24" aria-hidden="true"><polyline class="fever" points="2,18 9,14 13,17 19,6 24,11 32,3"/></svg>
        <h1>Börsenfieber</h1></div>
      ${G?`<div class="progress">
        <span class="label">${G.phase==='end'?'Spielende':`Jahr ${G.year} / ${ROUNDS}`}</span><span class="years" aria-hidden="true">${yearDots}</span>
        ${G.phase==='end'?'':`<span class="steps">${STEP_NAMES.map((n,i)=>`<span class="${i===idx?'on':''}">${n}</span>`).join('')}</span>`}
      </div>`:''}
    </div></header>${tickerHTML()}`;
  let body;
  if (!G) body = viewSetup();
  else {
    let main = '';
    switch (G.phase){
      case 'news': main = viewNews(); break;
      case 'handover': main = viewHandover(); break;
      case 'trade': main = viewTrade(); break;
      case 'market': main = viewMarket(); break;
      case 'end': main = viewEnd(); break;
    }
    body = `<div class="grid"><main>${main}</main>${G.phase==='handover'?'':viewBoard(false)}</div>`;
  }
  app.innerHTML = `${header}<div class="wrap ${fresh?'enter':''}">${body}</div>`;
  if (fresh && G && G.phase==='market' && G.results && !G.rolling) countUp();
  if (fresh && G && G.phase==='end') confetti();
}

/* Spielstand bei einer neuen Version der Seite behalten */
function snapshot(){
  if (!G) return {setupRows};
  return {setupRows, G:{...G, players:G.players.map(p=>({...p, sold:[...p.sold]}))}};
}
function start(data){
  try {
    if (data && data.setupRows) setupRows = data.setupRows;
    if (data && data.G){ G = data.G; G.rolling = false; G.players.forEach(p=>{ p.sold = new Set(p.sold||[]); }); }
  } catch { G = null; }
  render();
}
window.claude?.hot?.snapshot?.(snapshot);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
